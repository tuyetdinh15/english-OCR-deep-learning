[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-dl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["opencv-python", "numpy", "pandas", "pillow", "scikit-learn", "tensorflow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
